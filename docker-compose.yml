services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/fleet
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
